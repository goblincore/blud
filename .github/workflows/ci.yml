# Typecheck and the full vitest suite, on every push.
#
# This is where the FULL suite runs. Locally, run the tests for what you
# changed (`npm run test:changed`, or `npx vitest run <path>`); see AGENTS.md.
# The GPU gates (march-hash, head-split, axe, ...) need a real GPU and a
# browser, so they stay local and are not run here. The one GPU job here,
# gpu-parity, needs neither: WebGPU compute from Node through Dawn on Mesa's
# software Vulkan (llvmpipe).
name: ci

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Written for `node --test`, so `npm test` (vitest) does not collect them.
      - run: node --test scripts/lib/normal-gradient-*.test.mjs scripts/zombie-normal-gradient-check.test.mjs

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # VITEST_ALL: include the slow group that a bare local `npm test` leaves out (vite.config.ts).
      - run: npx vitest run --shard=${{ matrix.shard }}/4
        env:
          VITEST_ALL: 1

  # The bake field (src/lab/sdf-zombie/body-normal-bake/bake.wgsl.ts) held to
  # sdBody: the *.gpu.test.ts suites, through Dawn (the `webgpu` package) on
  # llvmpipe. BLUD_REQUIRE_GPU=1 turns a missing adapter into a failure, so a
  # broken driver install cannot read as a green skip. Spec:
  # docs/superpowers/specs/2026-10-24-gpu-body-normal-bake-design.md.
  gpu-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: npm ci
      - run: npm run test:gpu
        env:
          BLUD_REQUIRE_GPU: 1
