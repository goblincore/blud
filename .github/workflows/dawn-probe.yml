# TEMPORARY: does dawn.node (the `webgpu` npm package) get a WebGPU adapter on a GitHub runner through lavapipe?
name: dawn-probe
on:
  push:
    paths: ['.github/dawn-probe/**', '.github/workflows/dawn-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
      - run: vulkaninfo --summary || true
      - run: npm init -y && npm i webgpu@0.6.2
        working-directory: .github/dawn-probe
      - name: probe (default)
        run: node probe.mjs
        working-directory: .github/dawn-probe
      - name: probe (backend=vulkan)
        if: always()
        run: DAWN_FLAGS="backend=vulkan" node probe.mjs
        working-directory: .github/dawn-probe
