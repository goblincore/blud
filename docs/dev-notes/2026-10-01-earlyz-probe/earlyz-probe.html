<!doctype html>
<meta charset="utf-8">
<title>early-z probe</title>
<script type="module">
// Does conservative depth (@builtin(frag_depth, greater)) restore early-Z on this
// browser/GPU? A full-screen occluder at depth 0.1 is drawn first; then LAYERS
// full-screen quads at raster depth 0.5 run an expensive fragment shader BEHIND it.
// If the hardware early-rejects them, the expensive variants cost ~nothing.
const W = 1024, H = 1024, LAYERS = 16, ITERS = 600, REPS = 12;
const out = {};
const a = await navigator.gpu.requestAdapter();
const hasTs = a.features.has('timestamp-query');
const d = await a.requestDevice({ requiredFeatures: hasTs ? ['timestamp-query'] : [] });
const color = d.createTexture({ size: [W, H], format: 'rgba8unorm', usage: GPUTextureUsage.RENDER_ATTACHMENT });
const depth = d.createTexture({ size: [W, H], format: 'depth32float', usage: GPUTextureUsage.RENDER_ATTACHMENT });
const VS = (z) => `@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  var p = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
  return vec4f(p[i], ${z}, 1.0); }`;
const HEAVY = `fn heavy(q: vec2f) -> f32 { var x = q.x * 0.001 + q.y * 0.0007; var acc = 0.0;
  for (var k = 0; k < ${ITERS}; k++) { x = fract(sin(x * 12.9898 + f32(k)) * 43758.5453); acc += x; }
  return acc; }`;
const variants = {
  occluded_no_depth_write: { pre: '', out: 'struct O { @location(0) c: vec4f }', body: 'o.c = vec4f(heavy(fc.xy) * 1e-3);' },
  occluded_frag_depth_plain: { pre: '', out: 'struct O { @location(0) c: vec4f, @builtin(frag_depth) d: f32 }', body: 'o.c = vec4f(heavy(fc.xy) * 1e-3); o.d = fc.z + 0.01;' },
  occluded_frag_depth_greater: { pre: 'requires fragment_depth;', out: 'struct O { @location(0) c: vec4f, @builtin(frag_depth, greater) d: f32 }', body: 'o.c = vec4f(heavy(fc.xy) * 1e-3); o.d = fc.z + 0.01;' },
  occluded_greater_with_discard: { pre: 'requires fragment_depth;', out: 'struct O { @location(0) c: vec4f, @builtin(frag_depth, greater) d: f32 }', body: 'let h = heavy(fc.xy); if (h < -1.0) { discard; } o.c = vec4f(h * 1e-3); o.d = fc.z + 0.01;' },
  occluded_discard_no_depth_write: { pre: '', out: 'struct O { @location(0) c: vec4f }', body: 'let h = heavy(fc.xy); if (h < -1.0) { discard; } o.c = vec4f(h * 1e-3);' },
  visible_reference_no_occluder: { pre: '', out: 'struct O { @location(0) c: vec4f }', body: 'o.c = vec4f(heavy(fc.xy) * 1e-3);', noOccluder: true },
};
const occMod = d.createShaderModule({ code: VS('0.1') + '\n@fragment fn fs() -> @location(0) vec4f { return vec4f(0.2); }' });
const occPipe = d.createRenderPipeline({ layout: 'auto', vertex: { module: occMod, entryPoint: 'vs' },
  fragment: { module: occMod, entryPoint: 'fs', targets: [{ format: 'rgba8unorm' }] },
  depthStencil: { format: 'depth32float', depthWriteEnabled: true, depthCompare: 'less' } });
const qs = hasTs ? d.createQuerySet({ type: 'timestamp', count: 2 }) : null;
const qb = hasTs ? d.createBuffer({ size: 16, usage: GPUBufferUsage.QUERY_RESOLVE | GPUBufferUsage.COPY_SRC }) : null;
const rb = hasTs ? d.createBuffer({ size: 16, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST }) : null;
for (const [name, v] of Object.entries(variants)) {
  const code = `${v.pre}\n${VS('0.5')}\n${HEAVY}\n${v.out}\n@fragment fn fs(@builtin(position) fc: vec4f) -> O { var o: O; ${v.body} return o; }`;
  d.pushErrorScope('validation');
  const m = d.createShaderModule({ code });
  const pipe = d.createRenderPipeline({ layout: 'auto', vertex: { module: m, entryPoint: 'vs' },
    fragment: { module: m, entryPoint: 'fs', targets: [{ format: 'rgba8unorm' }] },
    depthStencil: { format: 'depth32float', depthWriteEnabled: true, depthCompare: 'less' } });
  const err = await d.popErrorScope();
  if (err) { out[name] = { error: err.message.slice(0, 200) }; continue; }
  const times = [];
  for (let r = 0; r < REPS; r++) {
    const enc = d.createCommandEncoder();
    const pass = enc.beginRenderPass({
      colorAttachments: [{ view: color.createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }],
      depthStencilAttachment: { view: depth.createView(), depthLoadOp: 'clear', depthClearValue: 1, depthStoreOp: 'store' },
      ...(hasTs ? { timestampWrites: { querySet: qs, beginningOfPassWriteIndex: 0, endOfPassWriteIndex: 1 } } : {}),
    });
    if (!v.noOccluder) { pass.setPipeline(occPipe); pass.draw(3); }
    pass.setPipeline(pipe);
    for (let l = 0; l < LAYERS; l++) pass.draw(3);
    pass.end();
    if (hasTs) { enc.resolveQuerySet(qs, 0, 2, qb, 0); enc.copyBufferToBuffer(qb, 0, rb, 0, 16); }
    const t0 = performance.now();
    d.queue.submit([enc.finish()]);
    await d.queue.onSubmittedWorkDone();
    const wall = performance.now() - t0;
    let gpu = null;
    if (hasTs) { await rb.mapAsync(GPUMapMode.READ); const t = new BigUint64Array(rb.getMappedRange()); gpu = Number(t[1] - t[0]) / 1e6; rb.unmap(); }
    times.push(gpu ?? wall);
  }
  times.sort((x, y) => x - y);
  out[name] = { medianMs: +times[Math.floor(times.length / 2)].toFixed(3), minMs: +times[0].toFixed(3), source: hasTs ? 'timestamp' : 'wall' };
}
window.__earlyz = { ua: navigator.userAgent.match(/Chrome\/[0-9.]+/)?.[0], W, H, LAYERS, ITERS, out };
document.title = 'done';
</script>
