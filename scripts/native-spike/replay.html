<!doctype html>
<!--
  NATIVE-RENDERER SPIKE, step 2a: replay a capture (capture.mjs) through bare
  WebGPU — no three.js, no game — and time it. This is the browser half of the
  comparison; native/march-replay is the other half and does exactly the same
  work from the same manifest. Driven by replay-chrome.mjs, which serves this
  page and the capture directory and calls window.replay().
-->
<meta charset="utf-8">
<title>march replay</title>
<canvas id="view" width="400" height="300" style="image-rendering: pixelated; width: 800px"></canvas>
<script type="module">
const BU = GPUBufferUsage, TU = GPUTextureUsage;
const median = (a) => { const s = [...a].sort((x, y) => x - y); return s[s.length >> 1]; };

// Depth textures cannot be written from the CPU, so a captured one is drawn
// back in: the blob goes into an r32float texture and this writes it as depth.
const DEPTH_FILL = `
@group(0) @binding(0) var src: texture_2d<f32>;
@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  return vec4f(f32((i << 1u) & 2u) * 2.0 - 1.0, f32(i & 2u) * 2.0 - 1.0, 0.0, 1.0);
}
@fragment fn fs(@builtin(position) p: vec4f) -> @builtin(frag_depth) f32 {
  return textureLoad(src, vec2u(p.xy), 0).r;
}`;

async function load(dir, name) {
  const manifest = await (await fetch(`${dir}/${name}`)).json();
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  const device = await adapter.requestDevice({
    requiredFeatures: manifest.meta.features.filter((f) => adapter.features.has(f)),
    requiredLimits: manifest.meta.device.requiredLimits ?? {},
  });
  const errors = [];
  device.addEventListener('uncapturederror', (e) => errors.push(e.error.message));
  const blob = async (file) => new Uint8Array(await (await fetch(`${dir}/${file}`)).arrayBuffer());
  const objects = manifest.objects;
  const shared = new Map(); // immutable objects, by id

  const fillDepth = (texture, format, mip, width, height, bytes) => {
    const src = device.createTexture({ size: [width, height], format: 'r32float', usage: TU.TEXTURE_BINDING | TU.COPY_DST });
    device.queue.writeTexture({ texture: src }, bytes, { bytesPerRow: width * 4 }, [width, height]);
    const module = device.createShaderModule({ code: DEPTH_FILL });
    const pipeline = device.createRenderPipeline({
      layout: 'auto',
      vertex: { module, entryPoint: 'vs' },
      fragment: { module, entryPoint: 'fs', targets: [] },
      depthStencil: { format, depthWriteEnabled: true, depthCompare: 'always' },
    });
    const enc = device.createCommandEncoder();
    const pass = enc.beginRenderPass({
      colorAttachments: [],
      depthStencilAttachment: {
        view: texture.createView({ baseMipLevel: mip, mipLevelCount: 1 }),
        depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'store',
      },
    });
    pass.setPipeline(pipeline);
    pass.setBindGroup(0, device.createBindGroup({
      layout: pipeline.getBindGroupLayout(0), entries: [{ binding: 0, resource: src.createView() }],
    }));
    pass.draw(3);
    pass.end();
    device.queue.submit([enc.finish()]);
  };

  // THE COMPUTE-MARCH SPIKE (compute-march.mjs; docs/dev-notes/2026-11-10-compute-march-spike). A pass whose record
  // carries `compute` is replayed as a clear of two storage targets (colour rgba32float, depth r32float) followed by
  // one compute pass with a dispatch per captured draw. Each dispatch binds the draw's OWN bind groups, rebuilt on
  // layouts that are visible to the compute stage, and a third group: the two targets and the spike's tile list.
  const buildCompute = async (c, resolve) => {
    const usage = TU.STORAGE_BINDING | TU.RENDER_ATTACHMENT | TU.COPY_SRC;
    const color = device.createTexture({ size: [c.width, c.height], format: 'rgba32float', usage });
    const depth = device.createTexture({ size: [c.width, c.height], format: 'r32float', usage });
    const outLayout = device.createBindGroupLayout({ entries: [
      { binding: 0, visibility: 4, storageTexture: { access: 'write-only', format: 'rgba32float' } },
      { binding: 1, visibility: 4, storageTexture: { access: 'read-write', format: 'r32float' } },
      { binding: 2, visibility: 4, buffer: { type: 'read-only-storage' } },
    ] });
    const modules = new Map();
    const draws = [];
    for (const d of c.draws) {
      const layouts = [], groups = [];
      for (const g of d.groups) {
        const bg = objects[g.$ref], lay = objects[bg.desc.layout.$ref];
        if (lay.kind !== 'bindGroupLayout') throw new Error(`replay: compute needs an explicit bind group layout, got ${lay.kind}`);
        const layout = device.createBindGroupLayout({ entries: lay.desc.entries.map((e) => ({ ...e, visibility: 4 })) });
        layouts.push(layout);
        groups.push(device.createBindGroup({ layout, entries: await resolve(bg.desc.entries) }));
      }
      const bytes = await blob(d.tiles);
      const tiles = device.createBuffer({ size: bytes.length, usage: BU.STORAGE | BU.COPY_DST });
      device.queue.writeBuffer(tiles, 0, bytes);
      groups.push(device.createBindGroup({ layout: outLayout, entries: [
        { binding: 0, resource: color.createView() }, { binding: 1, resource: depth.createView() }, { binding: 2, resource: { buffer: tiles } },
      ] }));
      // One module per distinct text: a crowd frame's draws can share a program.
      if (!modules.has(d.code)) {
        const module = device.createShaderModule({ code: c.codes[d.code] });
        const info = await module.getCompilationInfo();
        for (const m of info.messages) if (m.type === 'error') errors.push(`compute shader ${d.code} line ${m.lineNum}: ${m.message}`);
        modules.set(d.code, module);
      }
      let pipeline = null;
      device.pushErrorScope('validation');
      try {
        pipeline = await device.createComputePipelineAsync({
          layout: device.createPipelineLayout({ bindGroupLayouts: [...layouts, outLayout] }),
          compute: { module: modules.get(d.code), entryPoint: 'main' },
        });
      } catch (e) { errors.push(`compute pipeline: ${e.message}`); }
      const scoped = await device.popErrorScope();
      if (scoped) errors.push(`compute pipeline (validation): ${scoped.message}`);
      draws.push({ pipeline, groups, count: d.count });
    }
    return {
      color, depth, draws,
      clear: { colorAttachments: [
        { view: color.createView(), clearValue: c.clear, loadOp: 'clear', storeOp: 'store' },
        { view: depth.createView(), clearValue: { r: 1, g: 0, b: 0, a: 0 }, loadOp: 'clear', storeOp: 'store' },
      ] },
    };
  };

  // Each pass gets its own copy of every buffer and texture it touched: the
  // capture holds their contents per pass, so there is nothing to share.
  const passes = [];
  for (const rec of manifest.passes) {
    const own = new Map();
    const contents = { ...rec.pre, ...rec.res };
    const get = async (r) => {
      const id = r.$ref, o = objects[id];
      const cache = (o.kind === 'buffer' || o.kind === 'texture' || o.kind === 'view' || o.kind === 'bindGroup') ? own : shared;
      // Cache the PROMISE: resolve() walks arrays concurrently, and two awaits
      // on one id must not build two objects.
      if (!cache.has(id)) cache.set(id, make(id, o));
      return cache.get(id);
    };
    const resolve = async (v) => {
      if (v === null || typeof v !== 'object') return v;
      if (v.$ref !== undefined) return get(v);
      if (Array.isArray(v)) return Promise.all(v.map(resolve));
      const out = {};
      for (const k in v) out[k] = await resolve(v[k]);
      return out;
    };
    const make = async (id, o) => {
      const d = o.desc;
      switch (o.kind) {
        case 'buffer': {
          const b = device.createBuffer({ size: Math.ceil(d.size / 4) * 4, usage: (d.usage & ~(BU.MAP_READ | BU.MAP_WRITE)) | BU.COPY_DST });
          const c = contents[id];
          if (c?.file) { const bytes = await blob(c.file); device.queue.writeBuffer(b, 0, bytes, 0, bytes.length & ~3); }
          return b;
        }
        case 'texture': {
          const depth = d.format.startsWith('depth');
          const t = device.createTexture({
            size: d.size, format: d.format, dimension: d.dimension, mipLevelCount: d.mipLevelCount,
            sampleCount: d.sampleCount, viewFormats: d.viewFormats,
            usage: d.usage | TU.COPY_SRC | (depth ? TU.RENDER_ATTACHMENT : TU.COPY_DST),
          });
          const c = contents[id];
          for (const [m, mip] of (c?.mips ?? []).entries()) {
            const bytes = await blob(mip.file);
            if (depth) fillDepth(t, d.format, m, mip.width, mip.height, bytes);
            else device.queue.writeTexture({ texture: t, mipLevel: m }, bytes, { bytesPerRow: mip.bytesPerRow, rowsPerImage: mip.height }, [mip.width, mip.height, mip.layers]);
          }
          return t;
        }
        case 'view': {
          const { swizzle, usage, label, ...vd } = d;
          return (await get(o.texture)).createView(vd);
        }
        case 'sampler': return device.createSampler(d);
        case 'shaderModule': return device.createShaderModule({ code: d.code });
        case 'bindGroupLayout': return device.createBindGroupLayout(d);
        case 'pipelineLayout': return device.createPipelineLayout(await resolve(d));
        case 'renderPipeline': return device.createRenderPipelineAsync(await resolve(d));
        case 'autoLayout': return (await get(o.pipeline)).getBindGroupLayout(o.index);
        case 'bindGroup': return device.createBindGroup(await resolve(d));
        default: throw new Error(`replay: unknown object kind ${o.kind}`);
      }
    };
    if (Object.keys(rec.pre).length > 0) throw new Error('replay: a pass that LOADS an attachment is not supported yet');
    const { timestampWrites, occlusionQuerySet, label, ...desc } = rec.desc;
    passes.push({
      label: rec.label,
      desc: await resolve(desc),
      cmds: await Promise.all(rec.cmds.map((c) => resolve(c))),
      output: rec.desc.colorAttachments[0] ? { ref: rec.desc.colorAttachments[0].view, post: rec.post } : null,
      get,
      compute: rec.compute ? await buildCompute(rec.compute, resolve) : null,
    });
  }
  await device.queue.onSubmittedWorkDone();
  return { manifest, device, passes, errors, blob };
}

const encodePasses = (enc, passes) => {
  for (const p of passes) {
    if (p.compute) {
      // The clear the render pass's loadOp did, then the march as dispatches.
      enc.beginRenderPass(p.compute.clear).end();
      const pass = enc.beginComputePass();
      for (const d of p.compute.draws) {
        if (!d.pipeline) continue;
        pass.setPipeline(d.pipeline);
        d.groups.forEach((g, i) => pass.setBindGroup(i, g));
        pass.dispatchWorkgroups(...d.count);
      }
      pass.end();
      continue;
    }
    const pass = enc.beginRenderPass(p.desc);
    for (const [name, ...args] of p.cmds) pass[name](...args);
    pass.end();
  }
};

// Read back colour attachment 0 of each pass and compare it with what the
// game itself rendered — a replay that draws a different picture measures a
// different workload.
async function parity({ manifest, device, passes, blob }, wantSheet = false) {
  const out = [];
  for (const p of passes) {
    if (!p.output) continue;
    const viewNode = manifest.objects[p.output.ref.$ref];
    const texId = viewNode.texture.$ref, d = manifest.objects[texId].desc;
    const ref = p.output.post[texId]?.mips?.[0];
    if (!ref || d.format !== 'rgba32float') { out.push({ label: p.label, skipped: d.format }); continue; }
    const tex = p.compute ? p.compute.color : await p.get(viewNode.texture);
    const bytesPerRow = Math.ceil((ref.width * 16) / 256) * 256;
    const staging = device.createBuffer({ size: bytesPerRow * ref.height, usage: BU.MAP_READ | BU.COPY_DST });
    const enc = device.createCommandEncoder();
    enc.copyTextureToBuffer({ texture: tex }, { buffer: staging, bytesPerRow }, [ref.width, ref.height]);
    device.queue.submit([enc.finish()]);
    await staging.mapAsync(GPUMapMode.READ);
    const got = new Float32Array(staging.getMappedRange());
    const want = new Float32Array((await blob(ref.file)).buffer);
    let maxDiff = 0, sum = 0, differing = 0, nonZero = 0;
    // Whole texels over the 1e-4 bar (any of the four floats), and floats that are not the same value at all.
    let texels = 0, inexact = 0, lastTexel = -1;
    // Per channel (r, g, b, and the clip depth in a): floats over the bar, and the largest difference.
    const chanOver = [0, 0, 0, 0], chanMax = [0, 0, 0, 0];
    // Texels that are a hit in one image and a miss in the other (a miss carries depth >= 0.99999).
    let hitFlips = 0;
    for (let y = 0; y < ref.height; y++) {
      for (let x = 0; x < ref.width * 4; x++) {
        const g = got[y * (bytesPerRow / 4) + x], w = want[y * ref.width * 4 + x];
        const diff = Math.abs(g - w);
        if (g !== w) inexact++;
        if (!(diff <= 1e-4)) chanOver[x & 3]++;
        if (diff > chanMax[x & 3]) chanMax[x & 3] = diff;
        if ((x & 3) === 3 && (g >= 0.99999) !== (w >= 0.99999)) hitFlips++;
        if (!(diff <= 1e-4) && lastTexel !== y * ref.width + (x >> 2)) { texels++; lastTexel = y * ref.width + (x >> 2); }
        if (!(diff <= 1e-4)) differing++;
        if (diff > maxDiff) maxDiff = diff;
        if (Number.isFinite(diff)) sum += diff;
        if (w !== 0) nonZero++;
      }
    }
    const n = ref.width * ref.height * 4;
    // COUNTER READBACK (ladder.mjs `count`): a shader that writes b = 1, 2 or 3 as a pixel class gets its r and g
    // summed per class. Read it for a `count` rung only: any other frame's blue can land on an integer by chance.
    const classes = {};
    // Pixels whose colour (not the depth in alpha) moved by more than 0.02 and by more than 0.1 in any channel:
    // the 1e-4 bar above counts float jitter, these count what an eye could see.
    let over02 = 0, over10 = 0;
    for (let y = 0; y < ref.height; y++) {
      for (let x = 0; x < ref.width; x++) {
        const o = y * (bytesPerRow / 4) + x * 4, k = Math.round(got[o + 2]);
        const w = (y * ref.width + x) * 4;
        const dc = Math.max(Math.abs(got[o] - want[w]), Math.abs(got[o + 1] - want[w + 1]), Math.abs(got[o + 2] - want[w + 2]));
        if (!(dc <= 0.02)) over02++;
        if (!(dc <= 0.1)) over10++;
        if (k < 1 || k > 3 || Math.abs(got[o + 2] - k) > 1e-3) continue;
        const c = (classes[k] ??= { pixels: 0, r: 0, g: 0 });
        c.pixels++; c.r += got[o]; c.g += got[o + 1];
      }
    }
    const entry = { label: p.label, maxDiff, meanDiff: sum / n, differingFrac: differing / n, nonZeroFrac: nonZero / n, over02, over10, classes, differingTexels: texels, inexactFloats: inexact, chanOver, chanMax, hitFlips };
    // A LOOK SHEET (ladder.mjs LADDER_SHEETS): the game's own frame | this replay | their difference times 8, as a PNG.
    if (wantSheet) entry.sheet = sheet(got, want, ref.width, ref.height, bytesPerRow / 4);
    out.push(entry);
    show(device, got, ref.width, ref.height, bytesPerRow / 4);
    staging.unmap();
  }
  return out;
}

function sheet(got, want, w, h, stride) {
  const canvas = document.createElement('canvas');
  canvas.width = w * 3; canvas.height = h;
  const img = new ImageData(w * 3, h);
  const enc = (v) => 255 * Math.min(1, Math.max(0, v)) ** (1 / 2.2);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) for (let c = 0; c < 4; c++) {
    const g = c < 3 ? got[y * stride + x * 4 + c] : 1, wv = c < 3 ? want[(y * w + x) * 4 + c] : 1;
    img.data[(y * w * 3 + x) * 4 + c] = c < 3 ? enc(wv) : 255;
    img.data[(y * w * 3 + w + x) * 4 + c] = c < 3 ? enc(g) : 255;
    img.data[(y * w * 3 + 2 * w + x) * 4 + c] = c < 3 ? Math.min(255, 255 * 8 * Math.abs(g - wv)) : 255;
  }
  canvas.getContext('2d').putImageData(img, 0, 0);
  return canvas.toDataURL('image/png');
}

// Put the replayed image on the page so a person can look at it.
function show(device, rgba, w, h, stride) {
  const canvas = document.getElementById('view');
  canvas.width = w; canvas.height = h;
  const img = new ImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) for (let c = 0; c < 3; c++) {
    img.data[(y * w + x) * 4 + c] = 255 * Math.min(1, Math.max(0, rgba[y * stride + x * 4 + c])) ** (1 / 2.2);
    img.data[(y * w + x) * 4 + 3] = 255;
  }
  canvas.getContext('2d').putImageData(img, 0, 0);
}

// The measurement both replayers share: K back-to-back copies of the captured
// passes in one command buffer, wall-clock from submit to completion, divided
// by K. Completion time is the only timestamp this GPU reports honestly
// (gpu-pass-timing.ts), and K amortises the submit round trip.
window.replay = async ({ dir, manifest = 'manifest.json', repeat = 20, rounds = 30, warmup = 5, sheet: wantSheet = false }) => {
  const state = await load(dir, manifest);
  const { device, passes, errors } = state;
  const first = device.createCommandEncoder();
  encodePasses(first, passes);
  device.queue.submit([first.finish()]);
  const check = await parity(state, wantSheet);
  const round = async () => {
    const enc = device.createCommandEncoder();
    for (let k = 0; k < repeat; k++) encodePasses(enc, passes);
    const buf = enc.finish();
    const t0 = performance.now();
    device.queue.submit([buf]);
    await device.queue.onSubmittedWorkDone();
    return (performance.now() - t0) / repeat;
  };
  for (let i = 0; i < warmup; i++) await round();
  const ms = [];
  for (let i = 0; i < rounds; i++) ms.push(await round());
  return { repeat, rounds, medianMs: median(ms), minMs: Math.min(...ms), maxMs: Math.max(...ms), ms, parity: check, errors };
};
window.replayReady = true;

// A LOOK BY EYE (compute-view.mjs): ?dir=/cap/<frame>&manifest=<name> replays that leg once and shows the sheet
// (the game's own frame | this replay | their difference times 8) with the comparison's numbers. Not timed.
const look = new URLSearchParams(location.search);
if (look.has('dir')) {
  document.body.style.cssText = 'background:#111;color:#ddd;font:14px system-ui;margin:24px';
  document.getElementById('view').style.display = 'none';
  const say = document.body.appendChild(document.createElement('p'));
  const name = `${look.get('dir').replace('/cap/', '')}, ${look.get('manifest') ?? 'manifest.json'}`;
  say.innerHTML = `<a href="/" style="color:#8cf">all frames</a> &nbsp; ${name}: replaying (a compute leg can take a minute to compile)…`;
  window.replay({ dir: look.get('dir'), manifest: look.get('manifest') ?? 'manifest.json', repeat: 1, rounds: 1, warmup: 0, sheet: true }).then((r) => {
    const p = r.parity[0] ?? {};
    say.innerHTML = `<a href="/" style="color:#8cf">all frames</a> &nbsp; <b>${name}</b><br>the game's frame | this replay | difference &times; 8<br>`
      + `texels over 1e-4: ${p.differingTexels}, largest difference ${Number(p.maxDiff).toPrecision(3)}, floats not identical: ${p.inexactFloats}, `
      + `colour moved by more than 0.02: ${p.over02} px, hit/miss flips: ${p.hitFlips}${r.errors.length ? `<br><span style="color:#f88">${r.errors.join('<br>')}</span>` : ''}`;
    if (p.sheet) { const img = document.body.appendChild(new Image()); img.src = p.sheet; img.style.cssText = 'width:100%;max-width:2400px;image-rendering:pixelated;margin-top:12px'; }
  }).catch((e) => { say.innerHTML += `<br><span style="color:#f88">${e.message}</span>`; });
}
</script>
