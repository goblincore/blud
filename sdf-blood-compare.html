<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Blud — blood comparison (Current slug / Impact splash / Original / Smooth)</title>
<style>
  body { margin: 0; background: #101014; color: #e8e8e8; font: 12px monospace; overflow: hidden; }
  #app { width: 100vw; height: 100vh; }
  #ui {
    position: fixed; top: 8px; left: 8px; z-index: 10;
    background: rgba(8,8,12,0.82); border: 1px solid #3a3a44; border-radius: 4px;
    padding: 8px 10px; width: 300px; max-height: calc(100vh - 16px); overflow: auto;
  }
  #ui summary { cursor: pointer; padding: 5px 0; }
  #ui h1 { font-size: 12px; margin: 0 0 6px; color: #c46a72; letter-spacing: 1px; }
  #ui .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  #ui label { flex: 0 0 78px; color: #9a9aa4; }
  #ui select, #ui input[type=number] { background: #1b1b22; color: #e8e8e8; border: 1px solid #3a3a44; font: 12px monospace; padding: 1px 3px; }
  #ui input[type=range] { flex: 1; }
  #ui button { background: #2a2a33; color: #e8e8e8; border: 1px solid #4a4a55; font: 12px monospace; padding: 2px 8px; cursor: pointer; }
  #ui button.on { background: #5a2530; border-color: #a04a56; }
  #ui .sep { border-top: 1px solid #2c2c34; margin: 7px 0; }
  #diag { white-space: pre; color: #9cc; font-size: 11px; }
  #hint { color: #7a7a84; font-size: 10px; line-height: 1.4; }
  #errors { position: fixed; bottom: 8px; left: 8px; z-index: 20; color: #ff6464; white-space: pre-wrap; max-width: 60vw; }
  #paused {
    position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 10;
    background: rgba(8,8,12,0.8); border: 1px solid #3a3a44; padding: 3px 10px; color: #fc9;
  }
  #status {
    position: fixed; right: 8px; bottom: 8px; z-index: 10;
    background: rgba(8,8,12,0.82); border: 1px solid #3a3a44; padding: 3px 10px;
    color: #9cc; font-size: 11px; white-space: pre;
  }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="ui">
    <h1>BLOOD SURFACE COMPARISON</h1>
    <details><summary>Controls — compare / play / replay</summary>
    <div id="controls"></div>
    <div class="sep"></div>
    <div id="diag">booting…</div>
    </details>
  </div>
  <div id="paused">paused — press Play (or Step)</div>
  <div id="status"></div>
  <div id="errors"></div>
  <script type="module" src="/src/lab/sdf-zombie/webgpu/blood-compare-main.ts"></script>
</body>
</html>
