<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Blud — flame lab</title>
<style>
  body { margin: 0; background: #1a1116; color: #eee; font: 13px monospace; overflow: hidden; }
  #app { width: 100vw; height: 100vh; }
  #panel {
    position: fixed; top: 38px; right: 8px; z-index: 10;
    background: rgba(0,0,0,0.78); padding: 10px; border: 1px solid #444;
    width: 260px; max-height: calc(100vh - 58px); overflow-y: auto; line-height: 1.4;
  }
  #panel[hidden] { display: none; }
  #panel-toggle {
    position: fixed; top: 8px; right: 8px; z-index: 11;
    width: 140px; padding: 5px 8px; border: 1px solid #555;
    background: rgba(0,0,0,0.78); color: #d88; font: 11px monospace;
    cursor: pointer;
  }
  #panel h2 { margin: 8px 0 4px; font-size: 12px; color: #d88; }
  #panel label { display: block; font-size: 11px; margin: 3px 0; }
  #panel input[type=range] { width: 100%; }
  #errors { color: #ff6464; font-size: 11px; white-space: pre-wrap; }
  #controls {
    position: fixed; bottom: 8px; left: 8px; z-index: 10;
    background: rgba(0,0,0,0.68); padding: 8px 10px; border: 1px solid #444;
    font-size: 11px; line-height: 1.6; color: #bbb;
  }
  #controls b { color: #d88; font-weight: normal; }
</style>
</head>
<body>
  <div id="app"></div>
  <button id="panel-toggle" type="button" aria-controls="panel" aria-expanded="true">debug: hide (H)</button>
  <div id="panel"><div id="errors"></div></div>
  <div id="controls">
    <b>drag</b> orbit &nbsp;·&nbsp; <b>wheel</b> zoom<br />
    <b>,</b> walk &nbsp;·&nbsp; <b>.</b> run &nbsp;·&nbsp; <b>k</b> collapse<br />
    <b>I</b> ignite &nbsp;·&nbsp; <b>O</b> extinguish &nbsp;·&nbsp; <b>H</b> panel
  </div>
  <div id="reference" style="position:fixed;bottom:8px;right:8px;z-index:9;display:flex;gap:4px;background:#15151ac0;padding:6px;border-radius:6px">
    <img src="/assets/blood-tiles/3321.png" style="height:120px;image-rendering:pixelated" alt="Blood burning run reference">
    <img src="/assets/blood-tiles/3323.png" style="height:120px;image-rendering:pixelated" alt="">
    <img src="/assets/blood-tiles/3325.png" style="height:120px;image-rendering:pixelated" alt="">
  </div>
  <script type="module" src="/src/lab/sdf-zombie/webgpu/flame-lab-main.ts"></script>
</body>
</html>
